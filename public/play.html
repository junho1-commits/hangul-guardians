<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한글 지킴이 · 학생 입장</title><link rel="stylesheet" href="/style.css"></head>
<body class="player"><div class="world-bg"></div><div class="world-shade"></div><header class="player-header"><a class="brand" href="/play"><span class="brand-mark">ㅎ</span><span>한글 지킴이</span></a><span id="connection" class="connection">연결 중</span></header><a class="mode-return" href="/">놀이 고르기 · 함께 하기</a><main class="player-main">
  <section id="joinScreen" class="join-screen"><div class="eyebrow">혼자서는 작은 빛 · 함께라면 큰 힘</div><h1>우리 반 지킴이에<br><em>함께해요.</em></h1><div class="player-art"><img src="/assets/characters.png" alt="세종대왕, 주시경 선생님, 먹물 도깨비"></div><form id="joinForm" class="join-form"><label>입장 번호<input id="pinInput" name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6자리 번호" autocomplete="off" required></label><label>지킴이 이름<input id="nameInput" name="name" maxlength="20" placeholder="예: 6번 민서" autocomplete="nickname" required></label><p id="joinError" class="form-error" role="alert"></p><button id="joinButton" class="primary" type="submit">지킴이 참여 →</button></form><p class="muted">선생님 화면에 있는 그림 주소나 입장 번호를 사용하세요.</p></section>
  <section id="playerGame" hidden><div class="player-identity"><strong id="playerName"></strong><span id="playerPin"></span></div><div class="player-bars"><div><span>괴물 <b id="playerHp"></b></span><div class="bar boss-bar"><i id="playerHpBar"></i></div></div><div><span>보호막 <b id="playerShield"></b></span><div class="bar shield-bar"><i id="playerShieldBar"></i></div></div></div>
    <div id="waiting" class="waiting-card"><div class="waiting-icon">ㅎ</div><h2 id="waitingTitle"></h2><p id="waitingText"></p><div id="waitingMembers" class="roster"></div></div>
    <div id="playerQuestion" class="player-question" hidden><div class="question-top"><span id="playerCategory" class="chip"></span><span id="playerTimer" class="timer"></span></div><h2 id="playerQuestionText"></h2><p id="playerHint" class="hint" hidden></p><div id="playerOptions" class="player-options"></div><div id="answerStatus" class="answer-status" role="status"></div><div id="playerExplanation" class="explanation" hidden></div></div>
    <div id="playerFinal" class="waiting-card" hidden><h1 id="playerFinalTitle"></h1><p id="playerFinalText"></p></div><p class="cooperation-tip">함께 생각하고, 서로 도움말를 나누어요.<br>우리 반 모두가 한마음입니다.</p><button id="leave" class="text-button">다른 대기실로 입장</button>
  </section>
</main><div id="toast" class="toast" role="status" hidden></div><script src="/socket.io/socket.io.js"></script><script src="/play.js"></script></body></html>
